name: Quality and deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: integrationhub-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  AWS_REGION: us-east-1
  AWS_STACK_NAME: integrationhub-demo

jobs:
  quality:
    name: Test, typecheck, build and validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Enable the locked pnpm version
        run: corepack enable

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run automated tests
        run: pnpm test

      - name: Check TypeScript
        run: pnpm typecheck

      - name: Build application
        run: pnpm build

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v3
        with:
          use-installer: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate AWS infrastructure
        run: sam validate --lint --template-file infra/template.yaml

      - name: Build AWS package
        run: |
          echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
          export PATH="$GITHUB_WORKSPACE/node_modules/.bin:$PATH"
          sam build --template-file infra/template.yaml

  deploy-aws:
    name: Deploy AWS and smoke test
    needs: quality
    if: >-
      github.event_name != 'pull_request' &&
      vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Enable the locked pnpm version
        run: corepack enable

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v3
        with:
          use-installer: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Receive short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: integrationhub-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Build AWS package
        run: |
          export PATH="$GITHUB_WORKSPACE/node_modules/.bin:$PATH"
          sam build --template-file infra/template.yaml

      - name: Deploy AWS stack
        shell: bash
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          artifact_bucket="integrationhub-github-artifacts-${account_id}-${AWS_REGION}"
          execution_role="arn:aws:iam::${account_id}:role/IntegrationHubCloudFormationExecutionRole"
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name "$AWS_STACK_NAME" \
            --region "$AWS_REGION" \
            --s3-bucket "$artifact_bucket" \
            --s3-prefix integrationhub \
            --capabilities CAPABILITY_IAM \
            --role-arn "$execution_role" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

      - name: Check the deployed AWS service
        shell: bash
        run: |
          health_url="$(aws cloudformation describe-stacks \
            --stack-name "$AWS_STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='HealthUrl'].OutputValue | [0]" \
            --output text)"
          test -n "$health_url"
          test "$health_url" != "None"
          response="$(curl --fail --silent --show-error --retry 5 --retry-all-errors "$health_url")"
          node -e 'const body=JSON.parse(process.argv[1]); if(body.status!=="ok") process.exit(1)' "$response"

  deploy-not-configured:
    name: AWS deploy is intentionally skipped until OIDC is configured
    needs: quality
    if: >-
      github.event_name != 'pull_request' &&
      vars.AWS_DEPLOY_ROLE_ARN == ''
    runs-on: ubuntu-latest
    steps:
      - run: echo "Quality passed. Configure AWS_DEPLOY_ROLE_ARN to enable secretless AWS deployment."
